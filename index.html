<title>Mi Transformación Pro V4</title>
<style>
:root{
  --bg:#070a09;--panel:#0f1412;--panel2:#151c18;--panel3:#1b241f;--line:#243029;
  --text:#f3f7f4;--muted:#8d9a92;--muted2:#66736b;--accent:#72e6aa;--accent2:#36bf7b;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{min-height:100vh;background:
 radial-gradient(circle at 92% -8%,rgba(64,191,124,.11),transparent 26rem),

button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}img{max-width:100%}
.shell{max-width:1320px;margin:auto;min-height:100vh}
.sidebar{display:none}
.content{padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(102px + var(--safe))}
.view{display:none}.view.active{display:block;animation:appear .18s ease-out}@keyframes appear{from{opacity:.25;transform:translateY(4px)}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:7px 2px 18px}.page-head h1{font-size:32px;letter-spacing:-.045em;line-height:1.05}.page-head p{margin-top:5px;color:var(--muted);font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.11em;font-weight:850;color:var(--accent);text-transform:uppercase}
.icon-btn{width:42px;height:42px;border-radius:13px;background:var(--panel2);display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.card{background:linear-gradient(180deg,#111714,#0e1311);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:22px;overflow:hidden;position:relative;background:
 radial-gradient(circle at 80% 20%,rgba(114,230,170,.16),transparent 15rem),
 linear-gradient(135deg,#0f2b1e,#132019 70%);border-color:#28513d}
.hero:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-95px;bottom:-120px;border:1px solid rgba(114,230,170,.18);box-shadow:0 0 0 34px rgba(114,230,170,.025),0 0 0 68px rgba(114,230,170,.018)}
.hero h2{font-size:27px;line-height:1.05;letter-spacing:-.04em;margin:9px 0 8px;max-width:520px}.hero p{color:#b5c4bb;line-height:1.5;font-size:14px;max-width:600px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:750;font-size:14px}.btn.primary{background:linear-gradient(135deg,var(--accent),#48cb89);border-color:transparent;color:#06110b}.btn.ghost{background:transparent}.btn.danger{color:#ff9d9d;border-color:#4c2929;background:#211414}.btn.small{min-height:34px;padding:7px 10px;font-size:12px}
.grid{display:grid;gap:10px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
.metric{padding:15px}.metric small{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.06em}.metric strong{display:block;font-size:23px;letter-spacing:-.035em;margin-top:6px}.metric .trend{font-size:11px;margin-top:5px;color:var(--accent)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 3px 9px}.section-title h3{font-size:16px}.section-title button{color:var(--accent);font-size:13px;font-weight:750}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week-day{padding:8px 3px;border-radius:11px;background:var(--panel);border:1px solid var(--line);text-align:center}.week-day small{font-size:9px;color:var(--muted);text-transform:uppercase}.week-day b{display:block;font-size:13px;margin-top:4px}.week-day.done{background:#122b1e;border-color:#29583f}.week-day.done b{color:var(--accent)}
.routine-card{padding:16px;margin-bottom:10px}.routine-top{display:flex;gap:12px;align-items:center}.routine-icon{width:46px;height:46px;border-radius:14px;background:var(--accentSoft);display:grid;place-items:center;color:var(--accent);font-weight:900}.routine-main{flex:1;min-width:0}.routine-main h3{font-size:17px}.routine-main p{font-size:12px;color:var(--muted);margin-top:3px}.routine-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:11px;color:#afbbb4}.pill.green{background:#112b1d;border-color:#28583f;color:#83e6af}
.tabs{display:flex;gap:7px;overflow:auto;padding:1px 1px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.chip{white-space:nowrap;padding:8px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px}.chip.on{color:#06110b;background:var(--accent);border-color:transparent;font-weight:800}
.exercise{margin-bottom:9px;overflow:hidden}.exercise-head{display:flex;align-items:center;gap:11px;padding:11px}.exercise-img{width:58px;height:58px;border-radius:13px;object-fit:cover;background:#070a08;border:1px solid #26342c}.exercise-main{flex:1;min-width:0}.exercise-main h4{font-size:15px}.exercise-main p{font-size:11px;color:var(--muted);margin-top:3px}.exercise-pr{font-size:10px;color:var(--accent);margin-top:5px}.exercise-body{display:none;border-top:1px solid var(--line);padding:13px}.exercise.open .exercise-body{display:block}.chev{color:var(--muted2);font-size:18px}
.sets-head,.set-row{display:grid;grid-template-columns:42px 1fr 1fr 42px;gap:7px;align-items:center}.sets-head{font-size:10px;color:var(--muted2);padding:2px 2px 6px}.set-row{margin:6px 0}.set-num{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--panel2);font-size:12px}.set-row input{width:100%;min-width:0;background:#090e0b;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}.set-done{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}.set-done.done{background:var(--accent);color:#06110b;border-color:transparent;font-weight:900}.exercise-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.restbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;padding:10px;border-radius:11px;background:#0a100c;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.library-tools{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}.search{position:relative}.search input,.select,input,textarea{width:100%;background:#0b100d;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}.search input{padding-left:36px}.search:before{content:"⌕";position:absolute;left:13px;top:10px;color:var(--muted);font-size:18px}.select{appearance:none}
.library-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.lib-card{overflow:hidden}.lib-photo{width:100%;aspect-ratio:1.15/1;object-fit:cover;background:#050806}.lib-info{padding:11px}.lib-info h4{font-size:14px;line-height:1.2}.lib-info p{color:var(--muted);font-size:11px;margin-top:4px}.lib-actions{display:grid;grid-template-columns:1fr 38px;gap:6px;margin-top:10px}.lib-actions .btn{padding:8px 7px;min-height:36px;font-size:11px}.mini-btn{height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.nutrition-summary{padding:15px}.progress-ring{--p:75;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel3) 0);position:relative}.progress-ring:after{content:"";position:absolute;width:56px;height:56px;border-radius:50%;background:var(--panel)}.progress-ring b{position:relative;z-index:1;font-size:16px}.nutrition-top{display:flex;gap:14px;align-items:center}.nutrition-top>div:last-child{flex:1}.nutrition-top h3{font-size:17px}.nutrition-top p{font-size:12px;color:var(--muted);margin-top:4px}.habit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.habit{padding:10px 6px;text-align:center;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}.habit small{font-size:9px;color:var(--muted)}.habit b{display:block;margin-top:4px;font-size:13px}
.meal{margin-bottom:9px;overflow:hidden}.meal-head{padding:13px;display:flex;align-items:center;gap:10px}.meal-status{width:34px;height:34px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;color:var(--muted)}.meal-status.done{background:#133220;color:var(--accent)}.meal-main{flex:1}.meal-tag{font-size:10px;color:var(--accent);font-weight:800;text-transform:uppercase}.meal-main h4{font-size:14px;margin-top:2px}.meal-main p{font-size:11px;color:var(--muted);margin-top:3px}.meal-body{display:none;padding:0 13px 13px;border-top:1px solid var(--line)}.meal.open .meal-body{display:block}.recipe-cols{display:grid;gap:12px;margin-top:12px}.recipe-cols h5{font-size:12px;margin-bottom:7px}.recipe-list{padding-left:18px;color:#a8b5ad;font-size:12px;line-height:1.5}.carb{margin-top:10px;padding:11px;border-radius:11px;background:#10271b;border:1px solid #28543c}.carb b{color:var(--accent);font-size:12px}.carb p{font-size:11px;color:#a9baaf;margin-top:3px}
.history-list{max-height:330px;overflow:auto}.history-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border-bottom:0}.history-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}.history-item div:nth-child(2){flex:1}.history-item h5{font-size:12px}.history-item p{font-size:10px;color:var(--muted);margin-top:2px}.history-item time{font-size:10px;color:var(--muted2)}
.chart-card{padding:14px}.chart-head{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:10px}.chart-head h3{font-size:14px}.chart-head span{font-size:11px;color:var(--muted)}canvas{width:100%;height:200px;display:block}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photo-slot{aspect-ratio:.82/1;border-radius:12px;background:var(--panel2);border:1px dashed #34423a;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px;text-align:center;padding:5px}.photo-slot img{width:100%;height:100%;object-fit:cover}
.settings-list{overflow:hidden}.setting-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-icon{width:36px;height:36px;border-radius:11px;background:var(--panel2);display:grid;place-items:center}.setting-main{flex:1}.setting-main h4{font-size:14px}.setting-main p{font-size:11px;color:var(--muted);margin-top:2px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(8,11,9,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(70,85,76,.4);padding:6px 7px calc(7px + var(--safe))}.bottom-in{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav{display:flex;flex-direction:column;gap:3px;align-items:center;padding:5px 2px;color:var(--muted2);font-size:9px}.nav i{font-style:normal;font-size:20px;line-height:1}.nav.on{color:var(--accent)}
.modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(1,4,2,.76);backdrop-filter:blur(10px);align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#141c17,#0e1411);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 14px calc(24px + var(--safe));box-shadow:0 -20px 70px rgba(0,0,0,.45)}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.sheet-head h2{font-size:23px;letter-spacing:-.035em}.sheet-head p{font-size:12px;color:var(--muted);margin-top:4px}.close{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.demo{border-radius:16px;overflow:hidden;background:#050705;border:1px solid var(--line)}.demo img{width:100%;display:block;max-height:430px;object-fit:contain}.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.detail-steps{padding:13px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.detail-steps li{margin:7px 0 7px 18px;font-size:12px;color:#a6b3ab;line-height:1.45}
.form-grid{display:grid;gap:9px}.form-grid label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}.image-preview{height:170px;border-radius:14px;background:#090d0b;border:1px dashed #334239;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px}.image-preview img{width:100%;height:100%;object-fit:cover}
.builder-item{display:flex;align-items:center;gap:8px;padding:9px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:7px}.builder-item img{width:43px;height:43px;border-radius:10px;object-fit:cover}.builder-item>div:nth-child(2){flex:1}.builder-item h5{font-size:12px}.builder-item p{font-size:10px;color:var(--muted);margin-top:2px}.builder-controls{display:flex;gap:4px}.builder-controls button{width:31px;height:31px;border-radius:9px;background:var(--panel2);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe));transform:translateX(-50%) translateY(12px);z-index:200;background:#e8fff1;color:#092013;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.timer{position:fixed;right:15px;bottom:calc(88px + var(--safe));z-index:80;display:none;padding:10px 13px;border-radius:999px;background:var(--accent);color:#06110b;font-weight:900;box-shadow:0 12px 32px rgba(0,0,0,.4)}.timer.show{display:block}

@media(min-width:760px){
  .content{padding:24px 24px 120px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .library-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.library-tools{grid-template-columns:1.4fr .7fr .7fr}
  .recipe-cols{grid-template-columns:1fr 1fr}.sheet{max-width:720px;margin:auto;border-radius:24px;margin-bottom:18px;border-bottom:1px solid var(--line)}
}
@media(min-width:980px){
  .shell{display:grid;grid-template-columns:238px minmax(0,1fr);gap:0}.sidebar{display:flex;position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);background:rgba(8,12,9,.82);backdrop-filter:blur(18px);flex-direction:column}
  .brand{display:flex;gap:10px;align-items:center;padding:5px 7px 26px}.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#183d2b,#24784e);display:grid;place-items:center;color:var(--accent);font-weight:950}.brand h2{font-size:16px}.brand p{font-size:10px;color:var(--muted);margin-top:2px}
  .side-nav{display:grid;gap:5px}.side-nav button{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:var(--muted);text-align:left}.side-nav button i{font-style:normal;width:22px;text-align:center}.side-nav button.on{background:var(--accentSoft);color:var(--accent)}
  .side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.side-foot small{color:var(--muted);font-size:10px}.side-foot b{display:block;margin-top:4px;font-size:13px}
  .content{padding:28px 34px 60px;max-width:1080px;width:100%;margin:auto}.bottom{display:none}.page-head h1{font-size:38px}.library-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dashboard-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:12px}.modal{align-items:center}.sheet{max-height:88vh;margin:auto;border-radius:24px}
}

/* ===== NUTRICIÓN PRO V4 ===== */
.macro-dashboard{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px
}
.macro-box{padding:11px;border-radius:13px;background:#0b110e;border:1px solid var(--line)}
.macro-box small{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.055em}
.macro-box b{display:block;margin-top:5px;font-size:15px}
.macro-track{height:5px;background:#242e28;border-radius:99px;overflow:hidden;margin-top:8px}
.macro-track span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.macro-caption{font-size:9px;color:var(--muted2);margin-top:5px}
.coach-card{
  padding:16px;background:
  radial-gradient(circle at 88% 12%,rgba(114,230,170,.11),transparent 11rem),
  linear-gradient(145deg,#10241a,#0f1713);border-color:#29523e
}
.coach-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.coach-top h3{font-size:18px;margin-top:5px}
.coach-top p{font-size:12px;color:#9dafA3;line-height:1.45;margin-top:5px}
.coach-icon{width:42px;height:42px;border-radius:13px;background:#163a28;color:var(--accent);display:grid;place-items:center;font-size:20px;border:1px solid #2b6849}
.quick-nutrition-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}
.quick-action{
  min-height:58px;padding:10px;border-radius:12px;background:rgba(8,14,10,.58);border:1px solid #294034;text-align:left
}
.quick-action b{display:block;font-size:12px}.quick-action span{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.3}
.today-meals{display:grid;gap:7px;margin-top:11px}
.today-meal{
  display:grid;grid-template-columns:31px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:9px 10px;border-radius:11px;background:#0b110e;border:1px solid var(--line)
}
.today-meal .status{width:29px;height:29px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;color:var(--muted)}
.today-meal.done .status{background:#153824;color:var(--accent)}
.today-meal h5{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-meal p{font-size:9px;color:var(--muted);margin-top:2px}
.today-meal button{color:var(--accent);font-size:10px;font-weight:800;padding:6px}
.nutrition-toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
.nutrition-tool{
  padding:10px 7px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:center
}
.nutrition-tool i{display:block;font-style:normal;font-size:18px;margin-bottom:5px}
.nutrition-tool b{display:block;font-size:10px}.nutrition-tool span{display:block;font-size:8px;color:var(--muted);margin-top:3px}
.meal-meta-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.macro-pill{display:inline-flex;padding:4px 6px;border-radius:7px;background:#0b120e;border:1px solid #24342b;font-size:9px;color:#aab9b0}
.meal-replaced{color:var(--orange)!important}
.meal-body-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.swap-grid{display:grid;gap:8px}
.swap-card{padding:13px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.swap-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.swap-card h4{font-size:14px}.swap-card p{color:var(--muted);font-size:10px;line-height:1.4;margin-top:4px}
.swap-macros{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}
.food-builder-preview{padding:14px;border-radius:15px;background:#0a120d;border:1px solid #28513b;margin-top:10px}
.food-builder-preview h3{font-size:17px}.food-builder-preview>p{font-size:11px;color:var(--muted);margin-top:4px}
.builder-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px}
.builder-macro{padding:8px 5px;border-radius:10px;background:#111a15;text-align:center}
.builder-macro small{display:block;font-size:8px;color:var(--muted)}.builder-macro b{display:block;font-size:12px;margin-top:3px}
.meal-block-list{display:grid;gap:7px;margin-top:10px}
.meal-block{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.meal-block-icon{width:34px;height:34px;border-radius:10px;background:var(--accentSoft);display:grid;place-items:center}
.meal-block>div:nth-child(2){flex:1}.meal-block h5{font-size:11px}.meal-block p{font-size:9px;color:var(--muted);margin-top:2px}
.meal-block strong{font-size:10px}
.context-options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.context-card{padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left}
.context-card i{font-style:normal;font-size:22px}.context-card h4{font-size:13px;margin-top:7px}.context-card p{font-size:10px;color:var(--muted);line-height:1.4;margin-top:4px}
.context-card .kcal{display:inline-block;margin-top:8px;color:var(--accent);font-size:10px;font-weight:800}
.nutrition-note{font-size:9px;line-height:1.45;color:var(--muted2);margin-top:9px}
@media(max-width:430px){
 .macro-dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}
 .quick-nutrition-actions{grid-template-columns:1fr 1fr}
}
@media(min-width:760px){
 .swap-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .context-options{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
</head>

<script>window.MTPRO_DATA={"library":[{"id":"0025","name":"Press banca con barra","category":"Pecho","muscle":"Pecho","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0025-EIeI8Vf.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0025-EIeI8Vf.gif","steps":["Lie flat on a bench with your feet flat on the ground and your back pressed against the bench.","Grasp the barbell with an overhand grip slightly wider than shoulder-width apart.","Lift the barbell off the rack and hold it directly above your chest with your arms fully extended.","Lower the barbell slowly towards your chest, keeping your elbows tucked in.","Pause for a moment when the barbell touches your chest.","Push the barbell back up to the starting position by extending your arms."],"secondary":["Tríceps","Shoulders"],"tracking":"weight_reps"},{"id":"0314","name":"Press inclinado con mancuernas","category":"Pecho","muscle":"Pecho","equipment":"Mancuernas","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0314-ns0SIbU.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0314-ns0SIbU.gif","steps":["Set up an incline bench at a 45-degree angle.","Sit on the bench with your feet flat on the ground and your back pressed firmly against the bench.","Hold a dumbbell in each hand, palms facing forward, and lift them to shoulder height.","Slowly lower the dumbbells to the sides of your chest, keeping your elbows at a 90-degree angle.","Push the dumbbells back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."],"secondary":["Shoulders","Tríceps"],"tracking":"weight_reps"},{"id":"0027","name":"Remo inclinado con barra","category":"Espalda","muscle":"Espalda alta","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0027-eZyBC3j.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0027-eZyBC3j.gif","steps":["Stand with your feet shoulder-width apart and knees slightly bent.","Bend forward at the hips while keeping your back straight and chest up.","Grasp the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Pull the barbell towards your lower chest by retracting your shoulder blades and squeezing your back muscles.","Pause for a moment at the top, then slowly lower the barbell back to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Bíceps","Forearms"],"tracking":"weight_reps"},{"id":"0198","name":"Jalón al pecho en polea","category":"Espalda","muscle":"Dorsales","equipment":"Polea","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0198-RVwzP10.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0198-RVwzP10.gif","steps":["Adjust the cable pulldown machine so that the seat is at a comfortable height and the knee pad is secured.","Sit on the seat with your back straight and your feet flat on the ground.","Grasp the cable bar with an overhand grip, slightly wider than shoulder-width apart.","Lean back slightly and engage your core.","Pull the cable bar down towards your chest, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly release the bar back to the starting position."],"secondary":["Bíceps","Forearms"],"tracking":"weight_reps"},{"id":"2330","name":"Jalón al pecho — recorrido completo","category":"Espalda","muscle":"Dorsales","equipment":"Polea","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/2330-LEprlgG.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/2330-LEprlgG.gif","steps":["Sit on the lat pulldown machine with your knees positioned under the pads.","Grasp the cable bar with an overhand grip, slightly wider than shoulder-width apart.","Lean back slightly and keep your chest up, maintaining a slight arch in your lower back.","Pull the bar down towards your upper chest, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly release the bar back to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Bíceps","Rhomboids","Rear Deltoids"],"tracking":"weight_reps"},{"id":"0292","name":"Remo unilateral con mancuerna","category":"Espalda","muscle":"Espalda alta","equipment":"Mancuernas","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0292-C0MA9bC.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0292-C0MA9bC.gif","steps":["Stand with your feet shoulder-width apart, holding a dumbbell in one hand with your palm facing your body.","Bend your knees slightly and hinge forward at the hips, keeping your back straight and your core engaged.","Let the dumbbell hang straight down towards the floor, with your arm fully extended.","Pull the dumbbell up towards your chest, keeping your elbow close to your body and squeezing your shoulder blades together.","Pause for a moment at the top, then slowly lower the dumbbell back down to the starting position.","Repeat for the desired number of repetitions, then switch sides."],"secondary":["Bíceps","Forearms"],"tracking":"weight_reps"},{"id":"0017","name":"Dominada asistida","category":"Espalda","muscle":"Dorsales","equipment":"Máquina","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0017-kiJ4Z2K.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0017-kiJ4Z2K.gif","steps":["Adjust the machine to your desired weight and height settings.","Grasp the handles with an overhand grip, slightly wider than shoulder-width apart.","Hang with your arms fully extended and your feet off the ground.","Engage your back muscles and pull your body up towards the handles, keeping your elbows close to your body.","Continue pulling until your chin is above the handles.","Pause for a moment at the top, then slowly lower your body back down to the starting position."],"secondary":["Bíceps","Forearms"],"tracking":"weight_reps"},{"id":"0031","name":"Curl de bíceps con barra","category":"Bíceps","muscle":"Bíceps","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0031-25GPyDY.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0031-25GPyDY.gif","steps":["Stand up straight with your feet shoulder-width apart and hold a barbell with an underhand grip, palms facing forward.","Keep your elbows close to your torso and exhale as you curl the weights while contracting your biceps.","Continue to raise the bar until your biceps are fully contracted and the bar is at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale as you slowly begin to lower the bar back to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Forearms"],"tracking":"weight_reps"},{"id":"0313","name":"Curl martillo con mancuernas","category":"Bíceps","muscle":"Bíceps","equipment":"Mancuernas","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0313-slDvUAU.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0313-slDvUAU.gif","steps":["Stand up straight with a dumbbell in each hand, palms facing your torso.","Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward.","This will be your starting position.","Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps.","Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps."],"secondary":["Forearms"],"tracking":"weight_reps"},{"id":"0070","name":"Curl predicador con barra","category":"Bíceps","muscle":"Bíceps","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0070-qOgPVf6.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0070-qOgPVf6.gif","steps":["Sit on a preacher bench with your upper arms resting on the pad and your chest against the support.","Grasp the barbell with an underhand grip, slightly wider than shoulder-width apart.","Keeping your upper arms stationary, exhale and curl the barbell up towards your shoulders.","Pause for a moment at the top, squeezing your biceps.","Inhale and slowly lower the barbell back down to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Forearms"],"tracking":"weight_reps"},{"id":"0241","name":"Tríceps en polea con barra V","category":"Tríceps","muscle":"Tríceps","equipment":"Polea","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0241-gAwDzB3.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0241-gAwDzB3.gif","steps":["Attach a v-bar attachment to the cable machine at the highest setting.","Stand facing the cable machine with your feet shoulder-width apart.","Grasp the v-bar with an overhand grip, palms facing down, and your hands shoulder-width apart.","Keep your elbows close to your sides and your upper arms stationary throughout the exercise.","Engage your triceps and exhale as you push the v-bar down until your arms are fully extended.","Pause for a moment at the bottom of the movement, squeezing your triceps."],"secondary":["Forearms"],"tracking":"weight_reps"},{"id":"0060","name":"Rompecráneos con barra","category":"Tríceps","muscle":"Tríceps","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0060-h8LFzo9.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0060-h8LFzo9.gif","steps":["Lie flat on a bench with your feet flat on the ground and your head at the end of the bench.","Hold the barbell with an overhand grip, hands shoulder-width apart, and extend your arms straight up over your chest.","Keeping your upper arms stationary, slowly lower the barbell towards your forehead by bending your elbows.","Pause for a moment when the barbell is just above your forehead, then extend your arms back up to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Shoulders"],"tracking":"weight_reps"},{"id":"0259","name":"Flexión cerrada","category":"Tríceps","muscle":"Tríceps","equipment":"Peso corporal","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0259-x6KpKpq.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0259-x6KpKpq.gif","steps":["Start in a high plank position with your hands placed close together, directly under your shoulders.","Engage your core and lower your body towards the ground, keeping your elbows close to your sides.","Push through your palms to extend your arms and return to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Chest","Shoulders"],"tracking":"reps"},{"id":"0043","name":"Sentadilla con barra","category":"Piernas","muscle":"Glúteos","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0043-qXTaZnJ.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0043-qXTaZnJ.gif","steps":["Stand with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell across your upper back, resting it on your traps or rear delts.","Engage your core and keep your chest up as you begin to lower your body down.","Bend at the knees and hips, pushing your hips back and down as if sitting into a chair.","Lower yourself until your thighs are parallel to the ground or slightly below.","Keep your knees in line with your toes and your weight in your heels."],"secondary":["Quadriceps","Isquiotibiales","Pantorrillas"],"tracking":"weight_reps"},{"id":"0042","name":"Sentadilla frontal","category":"Piernas","muscle":"Glúteos","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0042-zG0zs85.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0042-zG0zs85.gif","steps":["Start by standing with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell in front of your shoulders, resting it on your collarbone and shoulders.","Engage your core and keep your chest up as you lower your body down into a squat position, pushing your hips back and bending your knees.","Lower until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Quadriceps","Isquiotibiales","Pantorrillas"],"tracking":"weight_reps"},{"id":"1760","name":"Sentadilla goblet","category":"Piernas","muscle":"Cuádriceps","equipment":"Mancuernas","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/1760-yn8yg1r.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/1760-yn8yg1r.gif","steps":["Stand with your feet shoulder-width apart, holding a dumbbell vertically against your chest with both hands.","Keeping your chest up and core engaged, lower your body down into a squat position by pushing your hips back and bending your knees.","Continue lowering until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Glúteos","Isquiotibiales","Pantorrillas"],"tracking":"weight_reps"},{"id":"0739","name":"Prensa 45°","category":"Piernas","muscle":"Glúteos","equipment":"Prensa / trineo","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0739-10Z2DXU.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0739-10Z2DXU.gif","steps":["Adjust the seat and footplate of the sled machine to a comfortable position.","Sit on the sled machine with your back against the backrest and your feet shoulder-width apart on the footplate.","Grip the handles on the sides of the seat for stability.","Push the footplate away from your body by extending your legs, keeping your heels on the footplate.","Continue pushing until your legs are almost fully extended, but without locking your knees.","Pause for a moment at the top of the movement, then slowly lower the footplate back towards your body by bending your knees."],"secondary":["Quadriceps","Isquiotibiales","Pantorrillas"],"tracking":"weight_reps"},{"id":"0585","name":"Extensión de piernas","category":"Piernas","muscle":"Cuádriceps","equipment":"Máquina","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0585-my33uHU.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0585-my33uHU.gif","steps":["Adjust the seat height and backrest of the machine to fit your body.","Sit on the machine with your back against the backrest and your feet on the footpad.","Grasp the handles or sidebars for stability.","Extend your legs forward by straightening your knees, lifting the weight.","Pause for a moment at the top, then slowly lower the weight back to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Isquiotibiales"],"tracking":"weight_reps"},{"id":"0599","name":"Curl femoral sentado","category":"Piernas","muscle":"Isquiotibiales","equipment":"Máquina","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0599-Zg3XY7P.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0599-Zg3XY7P.gif","steps":["Adjust the machine to fit your body and sit on it with your back against the backrest.","Place your lower legs under the padded lever, just above your ankles.","Grasp the handles on the sides of the machine for support.","Keeping your upper legs stationary, exhale and curl your legs up as far as possible.","Hold the contracted position for a brief pause as you squeeze your hamstrings.","Inhale and slowly lower the lever back to the starting position."],"secondary":["Pantorrillas"],"tracking":"weight_reps"},{"id":"0586","name":"Curl femoral acostado","category":"Piernas","muscle":"Isquiotibiales","equipment":"Máquina","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0586-17lJ1kr.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0586-17lJ1kr.gif","steps":["Adjust the machine to fit your body and select the desired weight.","Lie face down on the machine with your legs straight and your heels against the padded lever.","Grasp the handles or the sides of the machine for stability.","Keeping your upper body stationary, exhale and curl your legs up as far as possible without lifting your hips off the pad.","Hold the contracted position for a brief pause as you squeeze your hamstrings.","Inhale and slowly lower the lever back to the starting position."],"secondary":["Pantorrillas"],"tracking":"weight_reps"},{"id":"0582","name":"Curl femoral arrodillado","category":"Piernas","muscle":"Isquiotibiales","equipment":"Máquina","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0582-nnmCTLN.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0582-nnmCTLN.gif","steps":["Adjust the machine to fit your body and select the desired weight.","Kneel on the machine facing downwards, with your knees resting on the pad and your feet secured under the footpads.","Grasp the handles or the sides of the machine for stability.","Keeping your upper body stationary, exhale and curl your legs up towards your glutes by flexing your knees.","Pause for a moment at the top of the movement, squeezing your hamstrings.","Inhale and slowly lower your legs back to the starting position, fully extending your knees."],"secondary":["Glúteos"],"tracking":"weight_reps"},{"id":"1460","name":"Zancadas caminando","category":"Piernas","muscle":"Glúteos","equipment":"Peso corporal","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/1460-IZVHb27.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/1460-IZVHb27.gif","steps":["Stand with your feet shoulder-width apart.","Take a step forward with your right leg, lowering your body into a lunge position.","Keep your torso upright and your front knee aligned with your ankle.","Push off with your right foot and bring your left foot forward, stepping into a lunge position with your left leg.","Continue alternating legs and walking forward, maintaining a controlled and steady pace.","Repeat for the desired number of repetitions."],"secondary":["Quadriceps","Isquiotibiales","Pantorrillas"],"tracking":"reps"},{"id":"0032","name":"Peso muerto convencional","category":"Glúteos","muscle":"Glúteos","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0032-ila4NZS.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0032-ila4NZS.gif","steps":["Stand with your feet shoulder-width apart and the barbell on the ground in front of you.","Bend your knees and hinge at the hips to lower your torso and grip the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Keep your back straight and chest lifted as you drive through your heels to lift the barbell off the ground, extending your hips and knees.","As you stand up straight, squeeze your glutes and keep your core engaged.","Lower the barbell back down to the ground by bending at the hips and knees, keeping your back straight.","Repeat for the desired number of repetitions."],"secondary":["Isquiotibiales","Lower Back"],"tracking":"weight_reps"},{"id":"0085","name":"Peso muerto rumano con barra","category":"Glúteos","muscle":"Glúteos","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0085-wQ2c4XD.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0085-wQ2c4XD.gif","steps":["Stand with your feet shoulder-width apart and your toes pointing forward.","Hold the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Bend at the hips, keeping your back straight and your knees slightly bent.","Lower the barbell towards the ground, keeping it close to your body.","Feel the stretch in your hamstrings as you lower the barbell.","Once you feel a stretch in your hamstrings, push your hips forward and stand up straight."],"secondary":["Isquiotibiales","Lower Back"],"tracking":"weight_reps"},{"id":"1459","name":"Peso muerto rumano con mancuernas","category":"Glúteos","muscle":"Glúteos","equipment":"Mancuernas","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/1459-rR0LJzx.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/1459-rR0LJzx.gif","steps":["Stand with your feet shoulder-width apart, holding a dumbbell in each hand with an overhand grip.","Keeping your back straight and your core engaged, hinge at the hips and lower the dumbbells towards the ground, allowing your knees to bend slightly.","Lower the dumbbells until you feel a stretch in your hamstrings, then push through your heels and engage your glutes to return to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Isquiotibiales","Lower Back"],"tracking":"weight_reps"},{"id":"0228","name":"Patada de glúteo en polea","category":"Glúteos","muscle":"Glúteos","equipment":"Polea","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0228-Kpajagk.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0228-Kpajagk.gif","steps":["Attach a cable to a low pulley and stand facing away from the machine.","Place the cable around your ankle and stand with your feet shoulder-width apart.","Keep your core engaged and your back straight throughout the exercise.","Slowly extend your leg straight back, squeezing your glutes at the top of the movement.","Pause for a moment, then return to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Isquiotibiales","Quadriceps"],"tracking":"weight_reps"},{"id":"0597","name":"Abducción de cadera en máquina","category":"Glúteos","muscle":"Abductores","equipment":"Máquina","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0597-CHpahtl.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0597-CHpahtl.gif","steps":["Adjust the seat height so that your knees are at a 90-degree angle.","Sit on the machine with your back against the backrest and your feet on the footrests.","Place your hands on the side handles for stability.","Engage your abductors and slowly push your legs apart, away from the midline of your body.","Pause for a moment at the end of the movement, then slowly bring your legs back together to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Glúteos","Isquiotibiales"],"tracking":"weight_reps"},{"id":"0605","name":"Elevación de gemelos en máquina","category":"Pantorrillas","muscle":"Pantorrillas","equipment":"Máquina","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0605-ykUOVze.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0605-ykUOVze.gif","steps":["Adjust the machine to your height and stand with your feet shoulder-width apart.","Place your shoulders under the pads and hold onto the handles for stability.","Raise your heels as high as possible by extending your ankles.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Soleus","Ankle Stabilizers"],"tracking":"weight_reps"},{"id":"1456","name":"Press militar con barra","category":"Hombros","muscle":"Hombros","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/1456-wdRZISl.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/1456-wdRZISl.gif","steps":["Stand with your feet shoulder-width apart and hold the barbell with an overhand grip, hands slightly closer than shoulder-width apart.","Lift the barbell to shoulder height, keeping your elbows close to your body.","Press the barbell overhead, extending your arms fully.","Lower the barbell back to shoulder height.","Repeat for the desired number of repetitions."],"secondary":["Tríceps","Espalda alta"],"tracking":"weight_reps"},{"id":"0334","name":"Elevación lateral con mancuernas","category":"Hombros","muscle":"Hombros","equipment":"Mancuernas","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0334-DsgkuIt.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0334-DsgkuIt.gif","steps":["Stand with your feet shoulder-width apart and hold a dumbbell in each hand, palms facing your body.","Keep your back straight and engage your core.","Raise your arms out to the sides until they are parallel to the floor, keeping a slight bend in your elbows.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Trapecio"],"tracking":"weight_reps"},{"id":"0178","name":"Elevación lateral en polea","category":"Hombros","muscle":"Hombros","equipment":"Polea","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0178-goJ6ezq.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0178-goJ6ezq.gif","steps":["Stand with your feet shoulder-width apart and grasp the cable handles with an overhand grip.","Keep your arms straight and your core engaged.","Raise your arms out to the sides until they are parallel to the floor.","Pause for a moment at the top, then slowly lower your arms back down to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Trapecio","Tríceps"],"tracking":"weight_reps"},{"id":"0361","name":"Press de hombro unilateral con mancuerna","category":"Hombros","muscle":"Hombros","equipment":"Mancuernas","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0361-84RyJf8.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0361-84RyJf8.gif","steps":["Stand with your feet shoulder-width apart and hold a dumbbell in one hand at shoulder level, palm facing forward.","Press the dumbbell upward until your arm is fully extended overhead.","Pause for a moment at the top, then slowly lower the dumbbell back to the starting position.","Repeat for the desired number of repetitions, then switch to the other arm."],"secondary":["Tríceps","Espalda alta"],"tracking":"weight_reps"},{"id":"0219","name":"Press de hombros en polea","category":"Hombros","muscle":"Hombros","equipment":"Polea","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0219-PzQanLE.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0219-PzQanLE.gif","steps":["Adjust the cable machine so that the handles are at shoulder height.","Stand facing away from the machine with your feet shoulder-width apart.","Grasp the handles with an overhand grip and bring them up to shoulder level, with your elbows bent and pointing outwards.","Press the handles upwards until your arms are fully extended overhead.","Pause for a moment at the top, then slowly lower the handles back down to shoulder level.","Repeat for the desired number of repetitions."],"secondary":["Tríceps","Espalda alta"],"tracking":"weight_reps"},{"id":"0095","name":"Encogimiento con barra","category":"Trapecio","muscle":"Trapecio","equipment":"Barra","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0095-dG7tG5y.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0095-dG7tG5y.gif","steps":["Stand with your feet shoulder-width apart and hold a barbell in front of you with an overhand grip.","Keep your arms straight and your back straight throughout the exercise.","Lift your shoulders up towards your ears as high as possible, squeezing your traps at the top.","Hold for a moment, then slowly lower your shoulders back down to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Shoulders"],"tracking":"weight_reps"},{"id":"3699","name":"Plancha con toque de hombros","category":"Core","muscle":"Core","equipment":"Peso corporal","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/3699-yRpV5TC.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/3699-yRpV5TC.gif","steps":["Start in a high plank position with your hands directly under your shoulders and your body in a straight line.","Engage your core and lift your right hand off the ground, reaching across to tap your left shoulder.","Place your right hand back on the ground and repeat with your left hand tapping your right shoulder.","Continue alternating shoulder taps while keeping your hips and torso stable.","Repeat for the desired number of repetitions."],"secondary":["Shoulders","Tríceps"],"tracking":"reps"},{"id":"0620","name":"Elevación de piernas en banco","category":"Core","muscle":"Core","equipment":"Peso corporal","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0620-WhuFnR7.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0620-WhuFnR7.gif","steps":["Lie flat on a flat bench with your back pressed against it.","Place your hands under your glutes for support.","Keep your legs straight and together, and lift them up towards the ceiling.","Pause for a moment at the top, then slowly lower your legs back down to the starting position.","Repeat for the desired number of repetitions."],"secondary":["Hip Flexors"],"tracking":"reps"},{"id":"0846","name":"Russian twist con peso","category":"Core","muscle":"Core","equipment":"Peso adicional","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0846-fZFZ704.jpg","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0846-fZFZ704.gif","steps":["Sit on the ground with your knees bent and your feet flat on the floor.","Hold a weight or medicine ball with both hands in front of your chest.","Lean back slightly, keeping your back straight and your core engaged.","Slowly twist your torso to the right, bringing the weight or medicine ball towards the floor on your right side.","Pause for a moment, then twist your torso to the left, bringing the weight or medicine ball towards the floor on your left side.","Continue alternating sides for the desired number of repetitions."],"secondary":["Obliques","Lower Back"],"tracking":"weight_reps"},{"id":"0687","name":"Russian twist","category":"Core","muscle":"Core","equipment":"Peso corporal","img":"https://cd   ${r.items.map((it,i)=>exerciseBlock(r,it,i,log)).join('')}

function ensureSetRows(r,it,log){
  if(!log.sets[it.exerciseId]) {
    let last=lastWeight(r.id,it.exerciseId), w=last??it.load??0;
    log.sets[it.exerciseId]=Array.from({length:it.sets},()=>({weight:w,reps:it.reps,done:false}));
    save();
  }
  let rows=log.sets[it.exerciseId];
  while(rows.length<it.sets)rows.push({weight:rows.at(-1)?.weight??it.load??0,reps:it.reps,done:false});
  if(rows.length>it.sets)rows.length=it.sets;
  return rows;
}
function exerciseBlock(r,it,i,log){
  let e=exById(it.exerciseId);if(!e)return '';
  let rows=ensureSetRows(r,it,log),last=lastWeight(r.id,e.id),pr=prWeight(r.id,e.id);
  return `<div class="card exercise" id="ex-${i}"><div class="exercise-head" onclick="this.parentElement.classList.toggle('open')"><img class="exercise-img" src="${e.img||''}" alt="${e.name}"><div class="exercise-main"><h4>${e.name}</h4><p>${e.muscle} · ${it.sets} × ${it.reps} · ${it.rest}s descanso</p>${last!=null?`<div class="exercise-pr">Última: ${last} kg${pr!=null?` · PR ${pr} kg`:''}</div>`:''}</div><span class="chev">⌄</span></div>
  <div class="exercise-body"><div class="sets-head"><span>Serie</span><span>kg</span><span>reps</span><span>✓</span></div>
  ${rows.map((s,si)=>`<div class="set-row"><div class="set-num">${si+1}</div><input inputmode="decimal" value="${s.weight??0}" onchange="updateSet('${r.id}','${e.id}',${si},'weight',this.value)"><input inputmode="numeric" value="${s.reps??it.reps}" onchange="updateSet('${r.id}','${e.id}',${si},'reps',this.value)"><button class="set-done ${s.done?'done':''}" onclick="toggleSetDone('${r.id}','${e.id}',${si},this)">✓</button></div>`).join('')}
  <div class="exercise-actions"><button class="btn" onclick="openExercise('${e.id}')">▣ Ver técnica</button><button class="btn" onclick="startTimer(${it.rest})">◷ Descanso ${it.rest}s</button></div>
  <div class="restbar"><span>${e.equipment} · ${e.muscle}</span><button style="color:var(--accent);font-weight:750" onclick="openExerciseHistory('${r.id}','${e.id}')">Historial</button></div></div></div>`;
}
function updateSet(rid,eid,i,k,v){let r=S.routines.find(x=>x.id===rid),w=logFor(rid);let row=w.sets[eid][i];row[k]=Number(String(v).replace(',','.'))||0;save()}
function toggleSetDone(rid,eid,i,b){let w=logFor(rid);w.sets[eid][i].done=!w.sets[eid][i].done;b.classList.toggle('done');save()}

  <div class="section-title"><h3>Últimos registros</h3><button onclick="openNutritionHistory()">Ver todos</button></div><div class="card" style="padding:0 14px"><div class="history-list">${nutritionHistoryHTML(8)}</div></div>
  <p class="nutrition-note">Los valores energéticos y de macronutrientes son aproximaciones de planificación. Si necesitás precisión nutricional, deben ajustarse a las marcas, gramajes reales, cocción y evaluación profesional.</p>`;
}
function mealBlock(m,i,orig){
  let done=S.food.some(x=>x.date===logicalDay()&&x.day===S.nutritionDay&&x.meal===i),mac=mealMacro(m),replaced=!!S.nutritionOverrides[overrideKey(S.nutritionDay,i)];
  return `<div class="card meal"><div class="meal-head" onclick="this.parentElement.classList.toggle('open')"><button class="meal-status ${done?'done':''}" onclick="event.stopPropagation();toggleMeal(${i})">${done?'✓':'○'}</button><div class="meal-main"><div class="meal-tag ${replaced?'meal-replaced':''}">${orig.label}${replaced?' · OPCIÓN CAMBIADA':''}</div><h4>${m.name}</h4><p>${m.time} · ${m.carb?.title||'Comida'}: ${m.carb?.amount||''}</p><div class="meal-meta-row"><span class="macro-pill">~${mac.kcal} kcal</span><span class="macro-pill">${mac.p}g prot.</span><span class="macro-pill">${mac.c}g carb.</span><span class="macro-pill">${mac.f}g grasa</span></div></div><span class="chev">⌄</span></div><div class="meal-body"><div class="recipe-cols"><div><h5>Ingredientes</h5><ul class="recipe-list">${(m.ingredients||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h5>Preparación</h5><ol class="recipe-list">${(m.steps||[]).map(x=>`<li>${x}</li>`).join('')}</ol></div></div><div class="carb"><b>${m.carb?.title||'Carbohidrato'} · ${m.carb?.amount||''}</b><p>${m.carb?.raw||''} · ${m.carb?.household||''}</p><p>${m.carb?.note||''}</p></div><div class="meal-body-actions"><button class="btn ${done?'primary':''}" onclick="toggleMeal(${i})">${done?'✓ Consumida':'Marcar consumida'}</button><button class="btn" onclick="openMealSwap(${i})">↻ Cambiar opción</button></div>${replaced?`<button class="btn ghost" style="width:100%;margin-top:7px" onclick="restoreOriginalMeal(${i})">Volver al plan original</button>`:''}</div></div>`
}
function toggleMeal(i){
  let k=S.food.findIndex(x=>x.date===logicalDay()&&x.day===S.nutritionDay&&x.meal===i);
  if(k>=0)S.food.splice(k,1);
  else{
    let m=activeMeal(S.nutritionDay,i),mac=mealMacro(m);
    S.food.push({id:Date.now(),date:logicalDay(),day:S.nutritionDay,meal:i,name:m.name,label:originalMeal(S.nutritionDay,i).label,macros:mac,source:m.flex?'flex':'plan'});
  }
  save();renderNutrition();toast(k>=0?'Registro eliminado':'Comida registrada')
}
function addWater(){let h=habitToday();h.water=Math.min(6,Math.round((h.water+.25)*100)/100);save();renderNutrition()}
function toggleCreatine(){let h=habitToday();h.creatine=!h.creatine;save();renderNutrition()}
function editProtein(){let h=habitToday(),v=prompt('Proteína consumida hoy (g):',h.protein||'');if(v!==null){h.protein=Math.max(0,Number(v)||0);save();renderNutrition()}}
function nutritionHistoryHTML(limit=50){let a=[...S.food].sort((a,b)=>(b.date+(b.id||'')).localeCompare(a.date+(a.id||''))).slice(0,limit);return a.length?a.map(x=>`<div class="history-item"><span class="history-dot"></span><div><h5>${x.name}</h5><p>${x.label||'Comida'} · Día ${Number(x.day)+1}</p></div><time>${fmtDate(x.date)}</time></div>`).join(''):`<div style="padding:16px 0;color:var(--muted);font-size:12px">Todavía no registraste comidas.</div>`}

function renderProgress(){
  let body=latestBody(), wc=weightChange(), w7=recentWorkouts().length, fa=foodAdherence7(), prCount=countPRs();
  $('#progress').innerHTML=`<div class="page-head"><div><div class="eyebrow">ANÁLISIS</div><h1>Progreso</h1><p>Entrenamiento, cuerpo y adherencia.</p></div><button class="icon-btn" onclick="openBodyLog()">＋</button></div>
  <div class="grid three"><div class="card metric"><small>Peso</small><strong>${Number(body.weight).toFixed(1)} kg</strong><div class="trend">${wc<=0?'▼':'▲'} ${Math.abs(wc).toFixed(1)} kg</div></div><div class="card metric"><small>Entrenos · 7 días</small><strong>${w7}</strong><div class="trend">Meta 4/semana</div></div><div class="card metric"><small>PR detectados</small><strong>${prCount}</strong><div class="trend">Mejoras de carga</div></div></div>
  <div class="card chart-card" style="margin-top:10px"><div class="chart-head"><div><div class="eyebrow">CUERPO</div><h3>Evolución del peso</h3></div><button class="btn small" onclick="openBodyLog()">Registrar</button></div><canvas id="weightChart" width="900" height="260"></canvas></div>
  <div class="grid two" style="margin-top:10px"><div class="card chart-card"><div class="chart-head"><div><div class="eyebrow">NUTRICIÓN</div><h3>Adherencia · 7 días</h3></div><span>${fa}%</span></div><canvas id="foodChart" width="500" height="230"></canvas></div><div class="card chart-card"><div class="chart-head"><div><div class="eyebrow">ENTRENAMIENTO</div><h3>Volumen reciente</h3></div><span>kg × reps</span></div><canvas id="volumeChart" width="500" height="230"></canvas></div></div>
  <div class="section-title"><h3>Progresión por ejercicio</h3><button onclick="show('library')">Biblioteca</button></div><div class="card" style="padding:0 14px">${exerciseProgressRows()}</div>
  <div class="section-title"><h3>Fotos de progreso</h3><span></span></div><div class="photo-grid">${['front','side','back'].map(k=>photoSlot(k)).join('')}</div>`;
  requestAnimationFrame(()=>{drawWeight();drawFood();drawVolume()});
}
function countPRs(){let c=0;S.routines.forEach(r=>r.items.forEach(it=>{let h=getExerciseHistory(r.id,it.exerciseId);if(h.length>=2&&h.at(-1).best>h[0].best)c++}));return c}
function exerciseProgressRows(){let rows=[];S.routines.forEach(r=>r.items.forEach(it=>{let e=exById(it.exerciseId),h=getExerciseHistory(r.id,it.exerciseId);if(e&&h.length){let f=h[0].best,l=h.at(-1).best;rows.push({r,e,f,l,d:l-f})}}));rows.sort((a,b)=>b.d-a.d);return rows.length?rows.slice(0,12).map(x=>`<button class="history-item" style="width:100%;text-align:left" onclick="openExerciseHistory('${x.r.id}','${x.e.id}')"><img src="${x.e.img}" style="width:37px;height:37px;border-radius:10px;object-fit:cover"><div><h5>${x.e.name}</h5><p>${x.f} → ${x.l} kg</p></div><time style="color:${x.d>0?'var(--accent)':'var(--muted)'}">${x.d>0?'+':''}${x.d.toFixed(1)} kg</time></button>`).join(''):`<div style="padding:16px 0;color:var(--muted);font-size:12px">Registrá cargas durante tus entrenamientos y la progresión aparecerá acá.</div>`}
function photoSlot(k){let labels={front:'Frente',side:'Lateral',back:'Espalda'},p=S.photos[k];return `<label class="photo-slot">${p?`<img src="${p}" alt="${labels[k]}">`:`<span>＋<br>${labels[k]}</span>`}<input type="file" accept="image/*" style="display:none" onchange="savePhoto('${k}',this.files[0])"></label>`}
async function savePhoto(k,f){if(!f)return;S.photos[k]=await compressImage(f,680,.72);save();renderProgress();toast('Foto guardada')}
function openBodyLog(){openModal(`<div class="sheet-head"><div><div class="eyebrow">CUERPO</div><h2>Nuevo registro</h2><p>Guardá peso y, si querés, cintura.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div><label>Peso (kg)</label><input id="bodyW" inputmode="decimal" value="${latestBody().weight}"></div><div><label>Cintura (cm) · opcional</label><input id="bodyWaist" inputmode="decimal" value="${latestBody().waist||''}"></div><button class="btn primary" onclick="saveBody()">Guardar registro</button></div>`) }
function saveBody(){let w=Number(String($('#bodyW').value).replace(',','.')),wa=Number(String($('#bodyWaist').value).replace(',','.'))||null;if(!w)return;S.body.push({date:logicalDay(),weight:w,waist:wa});save();closeModal();renderProgress();toast('Progreso corporal guardado')}

function drawChart(canvas,data,{line=true,min=null,max=null}={}){
  if(!canvas)return;let g=canvas.getContext('2d'),W=canvas.width,H=canvas.height,p=34;g.clearRect(0,0,W,H);g.fillStyle='#0b100d';g.fillRect(0,0,W,H);
  if(!data.length){g.fillStyle='#7c8b82';g.font='14px Arial';g.fillText('Sin datos todavía',20,34);return}
  let vals=data.map(x=>x.v),lo=min??Math.min(...vals),hi=max??Math.max(...vals);if(lo===hi){lo-=1;hi+=1}let pad=(hi-lo)*.15;lo-=pad;hi+=pad;
  g.strokeStyle='#253129';g.lineWidth=1;for(let i=0;i<4;i++){let y=p+i*(H-2*p)/3;g.beginPath();g.moveTo(p,y);g.lineTo(W-p,y);g.stroke()}
  let pts=data.map((d,i)=>({x:p+(data.length===1?(W-2*p)/2:i*(W-2*p)/(data.length-1)),y:p+(hi-d.v)/(hi-lo)*(H-2*p)}));
  if(line){g.strokeStyle='#72e6aa';g.lineWidth=3;g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y));g.stroke()}
  pts.forEach((q,i)=>{g.fillStyle='#72e6aa';g.beginPath();g.arc(q.x,q.y,4,0,Math.PI*2);g.fill();if(data.length<=8){g.fillStyle='#98a79f';g.font='11px Arial';g.fillText(String(data[i].label||''),Math.max(2,q.x-14),H-8)}})
}
function drawWeight(){drawChart($('#weightChart'),S.body.slice(-12).map(x=>({v:Number(x.weight),label:fmtDate(x.date)})))}
function drawFood(){let d=[];for(let i=6;i>=0;i--){let x=new Date();x.setDate(x.getDate()-i);let iso=x.toISOString().slice(0,10);d.push({v:Math.min(4,foodForDate(iso).length),label:x.toLocaleDateString('es-PY',{weekday:'short'}).slice(0,2)})}drawBars($('#foodChart'),d,4)}
function workoutVolume(w){return Object.values(w.sets||{}).flat().filter(x=>x.done).reduce((a,x)=>a+(Number(x.weight)||0)*(Number(x.reps)||0),0)}
function drawVolume(){let arr=Object.values(S.workouts).filter(x=>x.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(-7).map(x=>({v:workoutVolume(x),label:fmtDate(x.date)}));drawBars($('#volumeChart'),arr)}
function drawBars(c,data,ceil=null){if(!c)return;let g=c.getContext('2d'),W=c.width,H=c.height,p=28;g.clearRect(0,0,W,H);g.fillStyle='#0b100d';g.fillRect(0,0,W,H);if(!data.length){g.fillStyle='#7c8b82';g.font='14px Arial';g.fillText('Sin datos todavía',18,32);return}let mx=ceil??Math.max(1,...data.map(x=>x.v));let bw=(W-2*p)/data.length*.55;data.forEach((d,i)=>{let x=p+(i+.5)*(W-2*p)/data.length,y=H-p-d.v/mx*(H-2*p);g.fillStyle='#72e6aa';g.fillRect(x-bw/2,y,bw,H-p-y);g.fillStyle='#87958d';g.font='10px Arial';g.fillText(d.label||'',x-12,H-8)})}

}

  openModal(`<div class="sheet-head"><div><div class="eyebrow">FICHA DEL EJERCICIO</div><h2>${e.name}</h2><p>${e.muscle} · ${e.equipment}</p></div><button class="close" onclick="closeModal()">×</button></div>

function openRoutineBuilder(){
  let options=S.routines.map((r,i)=>`<option value="${i}" ${i===S.routineIndex?'selected':''}>${r.name}</option>`).join('');
  openModal(`<div class="sheet-head"><div><div class="eyebrow">PERSONALIZAR</div><h2>Editar rutina</h2><p>Añadí, quitá, ordená o cambiá series y repeticiones.</p></div><button class="close" onclick="closeModal()">×</button></div>

  <div id="builderList" style="margin-top:12px">${builderItems()}</div>
  <button class="btn primary" style="width:100%;margin-top:10px" onclick="closeModal();show('library',false)">＋ Añadir ejercicio desde biblioteca</button>`);
}
function builderItems(){let r=activeRoutine();return r.items.map((it,i)=>{let e=exById(it.exerciseId);return `<div class="builder-item"><img src="${e?.img||''}"><div><h5>${e?.name||'Ejercicio'}</h5><p>${it.sets}×${it.reps} · ${it.rest}s</p></div><div class="builder-controls"><button onclick="moveRoutineItem(${i},-1)">↑</button><button onclick="moveRoutineItem(${i},1)">↓</button><button onclick="editRoutineItem(${i})">✎</button><button onclick="removeRoutineItem(${i})" style="color:#ff8d8d">×</button></div></div>`}).join('')}
function moveRoutineItem(i,d){let a=activeRoutine().items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();openRoutineBuilder()}
function removeRoutineItem(i){if(confirm('¿Quitar este ejercicio de la rutina?')){activeRoutine().items.splice(i,1);save();openRoutineBuilder();toast('Ejercicio eliminado')}}
function editRoutineItem(i){let it=activeRoutine().items[i],e=exById(it.exerciseId);openModal(`<div class="sheet-head"><div><div class="eyebrow">CONFIGURAR EJERCICIO</div><h2>${e.name}</h2><p>${activeRoutine().name}</p></div><button class="close" onclick="openRoutineBuilder()">←</button></div><div class="form-grid"><div class="grid two"><div><label>Series</label><input id="itSets" type="number" min="1" max="10" value="${it.sets}"></div><div><label>Repeticiones</label><input id="itReps" type="number" min="1" max="100" value="${it.reps}"></div></div><div class="grid two"><div><label>Descanso (seg)</label><input id="itRest" type="number" min="15" max="600" value="${it.rest}"></div><div><label>Carga inicial (kg)</label><input id="itLoad" inputmode="decimal" value="${it.load||0}"></div></div><button class="btn primary" onclick="saveRoutineItem(${i})">Guardar cambios</button></div>`)}
function saveRoutineItem(i){let it=activeRoutine().items[i];it.sets=Math.max(1,Number($('#itSets').value)||3);it.reps=Math.max(1,Number($('#itReps').value)||10);it.rest=Math.max(15,Number($('#itRest').value)||60);it.load=Number(String($('#itLoad').value).replace(',','.'))||0;save();openRoutineBuilder();toast('Ejercicio actualizado')}
function openAddToRoutine(eid){let e=exById(eid);openModal(`<div class="sheet-head"><div><div class="eyebrow">AÑADIR EJERCICIO</div><h2>${e.name}</h2><p>Elegí dónde querés colocarlo.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div><label>Rutina</label><select id="addRoutine" class="select">${S.routines.map((r,i)=>`<option value="${i}">${r.name}</option>`).join('')}</select></div><div class="grid two"><div><label>Series</label><input id="addSets" type="number" value="3"></div><div><label>Repeticiones</label><input id="addReps" type="number" value="10"></div></div><div><label>Descanso (seg)</label><input id="addRest" type="number" value="60"></div><button class="btn primary" onclick="addExerciseToRoutine('${eid}')">＋ Añadir</button></div>`)}
function addExerciseToRoutine(eid){let ri=Number($('#addRoutine').value),r=S.routines[ri];r.items.push({exerciseId:eid,sets:Number($('#addSets').value)||3,reps:Number($('#addReps').value)||10,rest:Number($('#addRest').value)||60,load:0});S.routineIndex=ri;save();closeModal();toast('Ejercicio añadido a '+r.name);if(S.view==='library')renderLibrary()}

// ------- Nutrition / other modals -------
function openNutritionHistory(){openModal(`<div class="sheet-head"><div><div class="eyebrow">ALIMENTACIÓN</div><h2>Historial de comidas</h2><p>Últimos registros guardados.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="card" style="padding:0 14px">${nutritionHistoryHTML(60)}</div>`)}
function openProfile(){let p=S.profile;openModal(`<div class="sheet-head"><div><div class="eyebrow">OBJETIVOS</div><h2>Tu plan</h2><p>Ajustá los rangos que aparecen en el dashboard.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="grid two"><div><label>Peso meta mínimo</label><input id="pMin" value="${p.targetMin}"></div><div><label>Peso meta máximo</label><input id="pMax" value="${p.targetMax}"></div></div><div class="grid two"><div><label>Proteína mínima (g)</label><input id="protMin" value="${p.proteinMin}"></div><div><label>Proteína máxima (g)</label><input id="protMax" value="${p.proteinMax}"></div></div><div class="grid two"><div><label>Carbohidratos mínimos (g)</label><input id="carbMin" value="${p.carbMin}"></div><div><label>Carbohidratos máximos (g)</label><input id="carbMax" value="${p.carbMax}"></div></div><div class="grid two"><div><label>Grasas mínimas (g)</label><input id="fatMin" value="${p.fatMin}"></div><div><label>Grasas máximas (g)</label><input id="fatMax" value="${p.fatMax}"></div></div><div class="grid two"><div><label>Calorías mínimas</label><input id="calMin" value="${p.calMin}"></div><div><label>Calorías máximas</label><input id="calMax" value="${p.calMax}"></div></div><div><label>Agua objetivo (L)</label><input id="waterGoal" value="${p.waterGoal}"></div><button class="btn primary" onclick="saveProfile()">Guardar objetivos</button></div>`)}
function saveProfile(){Object.assign(S.profile,{targetMin:Number($('#pMin').value)||76,targetMax:Number($('#pMax').value)||78,proteinMin:Number($('#protMin').value)||165,proteinMax:Number($('#protMax').value)||190,carbMin:Number($('#carbMin').value)||180,carbMax:Number($('#carbMax').value)||230,fatMin:Number($('#fatMin').value)||60,fatMax:Number($('#fatMax').value)||75,calMin:Number($('#calMin').value)||2200,calMax:Number($('#calMax').value)||2350,waterGoal:Number($('#waterGoal').value)||2.75});save();closeModal();renderMore();toast('Objetivos actualizados')}

// ------- Utilities -------
function openModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){$('#modal').classList.remove('open');document.body.style.overflow=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window._to);window._to=setTimeout(()=>x.classList.remove('show'),1800)}
let timerInt,timerSec=0;
function startTimer(s){clearInterval(timerInt);timerSec=s;$('#timer').classList.add('show');tickTimer();timerInt=setInterval(()=>{timerSec--;tickTimer();if(timerSec<=0){clearInterval(timerInt);setTimeout(()=>$('#timer').classList.remove('show'),1500)}},1000)}
function tickTimer(){$('#timer').textContent=timerSec>0?`Descanso ${Math.floor(timerSec/60)}:${String(timerSec%60).padStart(2,'0')}`:'Listo ✓'}
function compressImage(file,max=700,q=.75){return new Promise(res=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mi-transformacion-pro-respaldo.json';a.click();URL.revokeObjectURL(a.href)}
function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{S=Object.assign(deep(defaultState),JSON.parse(r.result));save();location.reload()}catch{alert('El archivo no es válido')}};r.readAsText(f)}
function clearData(){if(confirm('Esto eliminará registros, fotos y personalizaciones. ¿Continuar?')){localStorage.removeItem(STORE);location.reload()}}

// Bind nav
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view,false)));
$$('[data-side]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.side,false)));
render();show(S.view,true);
</script>
