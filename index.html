<!doctype html>
<html lang="es">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Transformación</title>
<style>

:root{
 --bg:#000;--surface:#1c1c1e;--surface2:#2c2c2e;--surface3:#3a3a3c;
 --label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.32);
 --sep:rgba(84,84,88,.58);--acc:#30d158;--red:#ff453a;--orange:#ff9f0a;
 --r:14px;--pad:16px;--safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark;scroll-behavior:smooth}
body{background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
#app{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--pad) calc(108px + var(--safe))}
.view{display:none}.view.active{display:block;animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(3px)}}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 18px}.hdr h1{font-size:34px;line-height:1.06;letter-spacing:-.035em}.sub,.muted{color:var(--label2)}.small{font-size:13px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px}.card-title{font-size:13px;color:var(--label2);font-weight:500;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--surface);border-radius:var(--r);padding:15px}.metric small{color:var(--label2);font-size:12px}.metric b{display:block;font-size:25px;margin-top:5px;letter-spacing:-.025em}
.hero{padding:18px;background:linear-gradient(145deg,#132b1d,#1c1c1e);border:1px solid rgba(48,209,88,.23);border-radius:18px;margin-bottom:12px}.hero .eyebrow{color:var(--acc);font-weight:700;font-size:12px}.hero h2{font-size:25px;line-height:1.08;margin:8px 0}.hero p{color:var(--label2);font-size:15px;line-height:1.4}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 15px;border-radius:12px;background:var(--surface2);font-weight:600}.btn.primary{background:var(--acc);color:#000}.btn.danger{color:var(--red)}
.tabs{display:flex;gap:7px;overflow:auto;margin:8px 0 14px;padding-bottom:2px}.chip{white-space:nowrap;padding:8px 11px;border-radius:999px;background:var(--surface);color:var(--label2);font-size:14px}.chip.on{background:var(--acc);color:#000;font-weight:700}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}.row{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:52px;position:relative}.row+.row:before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep)}.row-main{flex:1;min-width:0}.row-title{font-size:16px}.row-sub{font-size:13px;color:var(--label2);margin-top:2px}.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--surface2)}.chev{color:var(--label3)}
.exercise{background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:10px}.exercise-head{display:flex;align-items:center;gap:12px;padding:12px}.exercise-head .thumb{width:48px;height:48px;border-radius:10px}.exercise-body{display:none;padding:0 12px 14px}.exercise.open .exercise-body{display:block}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.set{padding:9px 4px;border-radius:9px;background:var(--surface2);font-size:13px}.set.done{background:var(--acc);color:#000;font-weight:700}.field{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field input{width:100%;background:var(--surface2);border:0;border-radius:10px;padding:11px}.load-note{font-size:12px;color:var(--label2);margin-top:7px}.load-note b{color:var(--acc)}
.media{display:none;margin-top:10px;border-radius:12px;overflow:hidden;background:#000;position:relative}.media.open{display:block}.media img{width:100%;display:block;max-height:380px;object-fit:contain}.media-cap{font-size:12px;color:var(--label2);padding:8px 10px;background:#111}
.steps{margin:10px 0 0 20px;color:var(--label2);font-size:13px;line-height:1.45}.steps li{margin:5px 0}
.meal{background:var(--surface);border-radius:var(--r);margin-bottom:10px;overflow:hidden}.meal-head{padding:14px}.meal-body{display:none;padding:0 14px 14px}.meal.open .meal-body{display:block}.meal-tag{font-size:12px;color:var(--acc);font-weight:700}.ingredients{padding-left:18px;color:var(--label2);font-size:14px;line-height:1.5}.carb{background:#112519;border-radius:11px;padding:11px;margin-top:10px}.carb b{color:var(--acc)}.food-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.progress{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--acc)}
.chart{width:100%;height:220px;background:#111;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 6px;border-bottom:.5px solid var(--sep)}th{color:var(--label2);font-weight:500}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(14,14,16,.92);backdrop-filter:blur(22px);border-top:.5px solid var(--sep);padding:6px 10px calc(7px + var(--safe));z-index:30}.bottom-inner{max-width:600px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--label3);font-size:10px;padding:5px}.nav .ico{font-size:20px;line-height:1}.nav.on{color:var(--acc)}
.modal{position:fixed;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.58);z-index:50}.modal.open{display:flex}.sheet{width:100%;max-width:600px;margin:auto;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:18px 16px calc(22px + var(--safe))}.sheet h2{font-size:24px}.sheet-close{float:right;color:var(--label2);font-size:22px}
.timer{position:fixed;right:14px;bottom:calc(84px + var(--safe));display:none;background:var(--acc);color:#000;border-radius:999px;padding:10px 14px;font-weight:700;z-index:35;box-shadow:0 8px 25px rgba(0,0,0,.45)}.timer.show{display:block}
.notice{font-size:12px;color:var(--label2);line-height:1.45}
@media(min-width:700px){.bottom{left:50%;right:auto;width:600px;transform:translateX(-50%)}}

</style>
</head>

<script>
window.MT_DATA={"routines":[{"id":"d1","title":"Pecho + Espalda + Brazos + Core","day":"Día 1","duration":"60–70 min","items":[{"id":"c-d1-warm","name":"Caminadora · calentamiento","sets":1,"sec":null,"group":"Cardio","desc":"8 min: 0–3 a 5,5 km/h (2%); 3–6 a 6,5 km/h (2%); 6–8 a 7,5 km/h (1%).","custom":true},{"id":"0025","name":"barbell bench press","sets":4,"reps":10,"weight":22.5,"sec":"","group":"Pecho","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0025-EIeI8Vf.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0025-EIeI8Vf.jpg","steps":["Lie flat on a bench with your feet flat on the ground and your back pressed against the bench.","Grasp the barbell with an overhand grip slightly wider than shoulder-width apart.","Lift the barbell off the rack and hold it directly above your chest with your arms fully extended.","Lower the barbell slowly towards your chest, keeping your elbows tucked in.","Pause for a moment when the barbell touches your chest.","Push the barbell back up to the starting position by extending your arms.","Repeat for the desired number of repetitions."],"target":"pectorals","secondary":["triceps","shoulders"]},{"id":"0314","name":"dumbbell incline bench press","sets":3,"reps":10,"weight":10,"sec":null,"group":"Pecho","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0314-ns0SIbU.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0314-ns0SIbU.jpg","steps":["Set up an incline bench at a 45-degree angle.","Sit on the bench with your feet flat on the ground and your back pressed firmly against the bench.","Hold a dumbbell in each hand, palms facing forward, and lift them to shoulder height.","Slowly lower the dumbbells to the sides of your chest, keeping your elbows at a 90-degree angle.","Push the dumbbells back up to the starting position, fully extending your arms.","Repeat for the desired number of repetitions."],"target":"pectorals","secondary":["shoulders","triceps"]},{"id":"0027","name":"barbell bent over row","sets":4,"reps":10,"weight":35,"sec":null,"group":"Espalda","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0027-eZyBC3j.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0027-eZyBC3j.jpg","steps":["Stand with your feet shoulder-width apart and knees slightly bent.","Bend forward at the hips while keeping your back straight and chest up.","Grasp the barbell with an overhand grip, hands slightly wider than shoulder-width apart.","Pull the barbell towards your lower chest by retracting your shoulder blades and squeezing your back muscles.","Pause for a moment at the top, then slowly lower the barbell back to the starting position.","Repeat for the desired number of repetitions."],"target":"upper back","secondary":["biceps","forearms"]},{"id":"0198","name":"cable pulldown","sets":3,"reps":10,"weight":35,"sec":null,"group":"Espalda","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0198-RVwzP10.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0198-RVwzP10.jpg","steps":["Adjust the cable pulldown machine so that the seat is at a comfortable height and the knee pad is secured.","Sit on the seat with your back straight and your feet flat on the ground.","Grasp the cable bar with an overhand grip, slightly wider than shoulder-width apart.","Lean back slightly and engage your core.","Pull the cable bar down towards your chest, squeezing your shoulder blades together.","Pause for a moment at the bottom of the movement, then slowly release the bar back to the starting position.","Repeat for the desired number of repetitions."],"target":"lats","secondary":["biceps","forearms"]},{"id":"0031","name":"barbell curl","sets":3,"reps":12,"weight":0,"sec":null,"group":"Bíceps","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0031-25GPyDY.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0031-25GPyDY.jpg","steps":["Stand up straight with your feet shoulder-width apart and hold a barbell with an underhand grip, palms facing forward.","Keep your elbows close to your torso and exhale as you curl the weights while contracting your biceps.","Continue to raise the bar until your biceps are fully contracted and the bar is at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale as you slowly begin to lower the bar back to the starting position.","Repeat for the desired number of repetitions."],"target":"biceps","secondary":["forearms"]},{"id":"0241","name":"cable triceps pushdown (v-bar)","sets":3,"reps":12,"weight":17.5,"sec":null,"group":"Tríceps","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0241-gAwDzB3.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0241-gAwDzB3.jpg","steps":["Attach a v-bar attachment to the cable machine at the highest setting.","Stand facing the cable machine with your feet shoulder-width apart.","Grasp the v-bar with an overhand grip, palms facing down, and your hands shoulder-width apart.","Keep your elbows close to your sides and your upper arms stationary throughout the exercise.","Engage your triceps and exhale as you push the v-bar down until your arms are fully extended.","Pause for a moment at the bottom of the movement, squeezing your triceps.","Inhale as you slowly return the v-bar to the starting position, maintaining control.","Repeat for the desired number of repetitions."],"target":"triceps","secondary":["forearms"]},{"id":"c-plank","name":"Plancha frontal","sets":3,"sec":45,"group":"Core","desc":"3 × 45 s. Cuerpo alineado, glúteos activos y costillas abajo.","custom":true},{"id":"0274","name":"crunch floor","sets":3,"reps":15,"weight":0,"sec":null,"group":"Core","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0274-TFqbd8t.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0274-TFqbd8t.jpg","steps":["Lie flat on your back with your knees bent and feet flat on the ground.","Place your hands behind your head with your elbows pointing outwards.","Engage your abs and lift your shoulders off the ground, curling forward towards your knees.","Pause for a moment at the top, then slowly lower your shoulders back down to the starting position.","Repeat for the desired number of repetitions."],"target":"abs","secondary":["hip flexors"]},{"id":"c-sideplank","name":"Plancha lateral","sets":3,"sec":30,"group":"Core","desc":"3 × 30 s por lado. Hombro sobre codo y cadera elevada.","custom":true},{"id":"c-d1-final","name":"Cardio final · intervalos","sets":1,"sec":null,"group":"Cardio","desc":"10 min: 1 min a 8,5 km/h + 1 min a 5,5 km/h. Repetir 5 veces.","custom":true}]},{"id":"d2","title":"Piernas + Glúteos","day":"Día 2","duration":"60–65 min","items":[{"id":"c-d2-warm","name":"Caminadora · calentamiento","sets":1,"sec":null,"group":"Cardio","desc":"8 min: 0–4 a 5,5 km/h (5%); 4–8 a 6 km/h (7%).","custom":true},{"id":"0043","name":"barbell full squat","sets":4,"reps":10,"weight":25,"sec":null,"group":"Cuádriceps","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0043-qXTaZnJ.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0043-qXTaZnJ.jpg","steps":["Stand with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell across your upper back, resting it on your traps or rear delts.","Engage your core and keep your chest up as you begin to lower your body down.","Bend at the knees and hips, pushing your hips back and down as if sitting into a chair.","Lower yourself until your thighs are parallel to the ground or slightly below.","Keep your knees in line with your toes and your weight in your heels.","Drive through your heels to stand back up, extending your hips and knees.","Repeat for the desired number of repetitions."],"target":"glutes","secondary":["quadriceps","hamstrings","calves","core"]},{"id":"0739","name":"sled 45в° leg press","sets":4,"reps":12,"weight":70,"sec":null,"group":"Cuádriceps + Glúteos","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0739-10Z2DXU.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0739-10Z2DXU.jpg","steps":["Adjust the seat and footplate of the sled machine to a comfortable position.","Sit on the sled machine with your back against the backrest and your feet shoulder-width apart on the footplate.","Grip the handles on the sides of the seat for stability.","Push the footplate away from your body by extending your legs, keeping your heels on the footplate.","Continue pushing until your legs are almost fully extended, but without locking your knees.","Pause for a moment at the top of the movement, then slowly lower the footplate back towards your body by bending your knees.","Repeat for the desired number of repetitions."],"target":"glutes","secondary":["quadriceps","hamstrings","calves"]},{"id":"0599","name":"lever seated leg curl","sets":3,"reps":12,"weight":0,"sec":null,"group":"Isquiotibiales","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0599-Zg3XY7P.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0599-Zg3XY7P.jpg","steps":["Adjust the machine to fit your body and sit on it with your back against the backrest.","Place your lower legs under the padded lever, just above your ankles.","Grasp the handles on the sides of the machine for support.","Keeping your upper legs stationary, exhale and curl your legs up as far as possible.","Hold the contracted position for a brief pause as you squeeze your hamstrings.","Inhale and slowly lower the lever back to the starting position.","Repeat for the desired number of repetitions."],"target":"hamstrings","secondary":["calves"]},{"id":"0228","name":"cable standing hip extension","sets":3,"reps":15,"weight":0,"sec":null,"group":"Glúteos","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0228-Kpajagk.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0228-Kpajagk.jpg","steps":["Attach a cable to a low pulley and stand facing away from the machine.","Place the cable around your ankle and stand with your feet shoulder-width apart.","Keep your core engaged and your back straight throughout the exercise.","Slowly extend your leg straight back, squeezing your glutes at the top of the movement.","Pause for a moment, then return to the starting position.","Repeat for the desired number of repetitions.","Switch sides and repeat with the other leg."],"target":"glutes","secondary":["hamstrings","quadriceps"]},{"id":"0597","name":"lever seated hip abduction","sets":3,"reps":15,"weight":20,"sec":null,"group":"Glúteo medio","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0597-CHpahtl.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0597-CHpahtl.jpg","steps":["Adjust the seat height so that your knees are at a 90-degree angle.","Sit on the machine with your back against the backrest and your feet on the footrests.","Place your hands on the side handles for stability.","Engage your abductors and slowly push your legs apart, away from the midline of your body.","Pause for a moment at the end of the movement, then slowly bring your legs back together to the starting position.","Repeat for the desired number of repetitions."],"target":"abductors","secondary":["glutes","hamstrings"]},{"id":"0605","name":"lever standing calf raise","sets":4,"reps":15,"weight":25,"sec":null,"group":"Pantorrillas","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0605-ykUOVze.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0605-ykUOVze.jpg","steps":["Adjust the machine to your height and stand with your feet shoulder-width apart.","Place your shoulders under the pads and hold onto the handles for stability.","Raise your heels as high as possible by extending your ankles.","Pause for a moment at the top, then slowly lower your heels back down to the starting position.","Repeat for the desired number of repetitions."],"target":"calves","secondary":["soleus","ankle stabilizers"]},{"id":"c-d2-final","name":"Cardio final","sets":1,"sec":null,"group":"Cardio","desc":"10 min constantes a 6 km/h con inclinación 6%.","custom":true}]},{"id":"d3","title":"HIIT + Abdominales","day":"Día 3","duration":"45–55 min","items":[{"id":"c-hiit","name":"Caminadora HIIT · 8 rondas","sets":1,"sec":null,"group":"HIIT","desc":"5 min calentamiento a 5,5 km/h (1%). 8 rondas: 30 s a 11–12 km/h + 60 s a 5,5 km/h. 5 min enfriamiento a 5 km/h.","custom":true},{"id":"3699","name":"shoulder tap","sets":4,"reps":20,"weight":0,"sec":null,"group":"Core","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/3699-yRpV5TC.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/3699-yRpV5TC.jpg","steps":["Start in a high plank position with your hands directly under your shoulders and your body in a straight line.","Engage your core and lift your right hand off the ground, reaching across to tap your left shoulder.","Place your right hand back on the ground and repeat with your left hand tapping your right shoulder.","Continue alternating shoulder taps while keeping your hips and torso stable.","Repeat for the desired number of repetitions."],"target":"abs","secondary":["shoulders","triceps"]},{"id":"0620","name":"lying leg raise flat bench","sets":4,"reps":15,"weight":0,"sec":null,"group":"Core","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0620-WhuFnR7.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0620-WhuFnR7.jpg","steps":["Lie flat on a flat bench with your back pressed against it.","Place your hands under your glutes for support.","Keep your legs straight and together, and lift them up towards the ceiling.","Pause for a moment at the top, then slowly lower your legs back down to the starting position.","Repeat for the desired number of repetitions."],"target":"abs","secondary":["hip flexors"]},{"id":"0846","name":"weighted russian twist","sets":4,"reps":20,"weight":5,"sec":null,"group":"Core","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0846-fZFZ704.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0846-fZFZ704.jpg","steps":["Sit on the ground with your knees bent and your feet flat on the floor.","Hold a weight or medicine ball with both hands in front of your chest.","Lean back slightly, keeping your back straight 5ebd/images/0042-zG0zs85.jpg","steps":["Start by standing with your feet shoulder-width apart, toes slightly turned out.","Hold the barbell in front of your shoulders, resting it on your collarbone and shoulders.","Engage your core and keep your chest up as you lower your body down into a squat position, pushing your hips back and bending your knees.","Lower until your thighs are parallel to the ground, or as low as you can comfortably go.","Pause for a moment at the bottom, then push through your heels to return to the starting position.","Repeat for the desired number of repetitions."],"target":"glutes","secondary":["quadriceps","hamstrings","calves","core"]},{"id":"0031","name":"barbell curl","sets":4,"reps":12,"weight":15,"sec":null,"group":"Bíceps","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0031-25GPyDY.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0031-25GPyDY.jpg","steps":["Stand up straight with your feet shoulder-width apart and hold a barbell with an underhand grip, palms facing forward.","Keep your elbows close to your torso and exhale as you curl the weights while contracting your biceps.","Continue to raise the bar until your biceps are fully contracted and the bar is at shoulder level.","Hold the contracted position for a brief pause as you squeeze your biceps.","Inhale as you slowly begin to lower the bar back to the starting position.","Repeat for the desired number of repetitions."],"target":"biceps","secondary":["forearms"]},{"id":"0313","name":"dumbbell hammer curl","sets":3,"reps":12,"weight":0,"sec":null,"group":"Bíceps","gif":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/0313-slDvUAU.gif","img":"https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/0313-slDvUAU.jpg","steps":["Stand up straight function renderHome(){
 const r=D.routines[S.routine],last=S.body.at(-1)?.weight||83.7,foodToday=S.food.filter(x=>x.date===logicalDay()).length,done=Object.values(S.workouts).filter(x=>x.done).length;
 $('#home').innerHTML=`<div class="hdr"><div><h1>Mi Transformación</h1><div class="sub">${new Date().toLocaleDateString('es-PY',{weekday:'long',day:'numeric',month:'long'})}</div></div></div>
 <div class="hero"><div class="eyebrow">PLAN PERSONAL</div><h2>Tu progreso, sin salir de la web.</h2><p>Rutina, demos animadas, cargas, comidas y evolución en una app estática lista para GitHub Pages.</p></div>
 <div class="grid2"><div class="metric"><small>Peso actual</small><b>${last.toFixed(1)} kg</b></div><div class="metric"><small>Meta</small><b>${S.target} kg</b></div><div class="metric"><small>Comidas hoy</small><b>${foodToday}/4</b></div><div class="metric"><small>Gym completados</small><b>${done}</b></div></div>
 <h4 style="margin:22px 4px 8px">Próxima rutina</h4>
 <div class="card"><div class="card-title">${r.day} · ${r.duration}</div><div style="font-size:22px;font-weight:700;margin-bottom:7px">${r.title}</div><div class="muted small">${r.items.length} bloques · cargas guardadas por ejercicio</div><button class="btn primary" style="margin-top:14px" onclick="show('workout',false)">Abrir entrenamiento</button></div>
 <div class="card"><div class="card-title">Objetivos diarios</div><div class="small muted">Proteína 160–190 g · Agua 2,5–3 L · Pasos 8.000–10.000 · Sueño 7–8 h</div></div>`;
}
function renderWorkout(){
 const r=D.routines[S.routine],log=currentLog();
 $('#workout').innerHTML=`<div class="hdr"><div><h1>Entrenar</h1><div class="sub">${r.title}</div></div></div>
 <div class="tabs">${D.routines.map((x,i)=>`<button class="chip ${i===S.routine?'on':''}" onclick="S.routine=${i};save();renderWorkout()">${x.day}</button>`).join('')}</div>
 ${r.items.map((e,i)=>exerciseHTML(e,i,r,log)).join('')}
 <button class="btn primary" onclick="finishWorkout()">${log.done?'✓ Entrenamiento completado':'Finalizar entrenamiento'}</button>`;
}
function exerciseHTML(e,i,r,log){
 if(e.custom)return `<div class="exercise"><div class="exercise-head" onclick="this.parentElement.classList.toggle('open')"><div class="thumb" style="display:grid;place-items:center">⌁</div><div class="row-main"><div class="row-title">${e.name}</div><div class="row-sub">${e.group}</div></div><span class="chev">›</span></div><div class="exercise-body"><div class="notice">${e.desc}</div></div></div>`;
 let last=lastLoad(r.id,e.id),done=log.sets[e.id]||[],val=log.loads[e.id]??(last??e.weight??'');
 return `<div class="exercise"><div class="exercise-head" onclick="this.parentElement.classList.toggle('open')"><img class="thumb" src="${e.img}" alt=""><div class="row-main"><div class="row-title">${titleCase(e.name)}</div><div class="row-sub">${e.group} · ${e.sets}×${e.reps||e.sec+' s'}</div>${last!=null?`<div class="load-note">Última carga: <b>${last} kg</b></div>`:''}</div><span class="chev">›</span></div>
 <div class="exercise-body"><button class="btn" onclick="event.stopPropagation();toggleMedia('${e.id}')">Ver demo dentro de la app</button><div class="media" id="m-${e.id}"><img src="${e.gif}" alt="${e.name}"><div class="media-cap">Tocá la demo para verla directamente en esta pantalla.</div></div>
 <div class="sets">${Array.from({length:e.sets},(_,s)=>`<button class="set ${done[s]?'done':''}" onclick="toggleSet('${e.id}',${s},this)">${s+1}</button>`).join('')}</div>
 <div class="field"><input inputmode="decimal" value="${val}" placeholder="kg" onchange="setLoad('${e.id}',this.value)"><button class="btn" onclick="startTimer(60)">Descanso 60 s</button></div>
 ${e.steps?.length?`<ol class="steps">${e.steps.slice(0,5).map(x=>`<li>${x}</li>`).join('')}</ol>`:''}</div></div>`;
}
function titleCase(s){return s.replace(/\b\w/g,c=>c.toUpperCase())}
function toggleMedia(id){$('#m-'+id)?.classList.toggle('open')}
function toggleSet(id,n,b){let l=currentLog();if(!l.sets[id])l.sets[id]=[];l.sets[id][n]=!l.sets[id][n];b.classList.toggle('done');save()}
function setLoad(id,v){currentLog().loads[id]=Number(String(v).replace(',','.'))||0;save()}
function finishWorkout(){let l=currentLog();l.done=true;save();renderWorkout();renderHome()}
let ti=null,ts=0;function startTimer(sec){clearInterval(ti);ts=sec;$('#timer').classList.add('show');tick();ti=setInterval(()=>{ts--;tick();if(ts<=0){clearInterval(ti);setTimeout(()=>$('#timer').classList.remove('show'),1200)}},1000)}function tick(){$('#timer').textContent=ts>0?`Descanso · ${String(Math.floor(ts/60)).padStart(2,'0')}:${String(ts%60).padStart(2,'0')}`:'Listo ✓'}

function renderNutrition(){
 const day=D.nutrition[S.nutritionDay];
 $('#nutrition').innerHTML=`<div class="hdr"><div><h1>Nutrición</h1><div class="sub">${day.day} · jornada 06:00–05:59</div></div></div>
 <div class="tabs">${D.nutrition.map((d,i)=>`<button class="chip ${i===S.nutritionDay?'on':''}" onclick="S.nutritionDay=${i};save();renderNutrition()">${i+1}</button>`).join('')}</div>
 ${day.meals.map((m,i)=>mealHTML(m,i)).join('')}
 <div class="card"><div class="card-title">Historial reciente</div>${foodHistory()}</div>`;
}
function mealHTML(m,i){let hit=S.food.some(x=>x.date===logicalDay()&&x.day===S.nutritionDay&&x.meal===i);
 return `<div class="meal"><div class="meal-head" onclick="this.parentElement.classList.toggle('open')"><div class="meal-tag">${m.label}</div><div style="font-weight:600;margin-top:3px">${m.name}</div><div class="row-sub">${m.time}</div></div><div class="meal-body">
 <div class="card-title">Ingredientes</div><ul class="ingredients">${m.ingredients.map(x=>`<li>${x}</li>`).join('')}</ul><div class="card-title" style="margin-top:12px">Preparación</div><ol class="steps">${m.steps.map(x=>`<li>${x}</li>`).join('')}</ol>
 <div class="carb"><b>${m.carb.title}</b><div class="small" style="margin-top:4px">${m.carb.amount} · ${m.carb.household}</div><div class="small muted" style="margin-top:4px">${m.carb.note}</div></div>
 <div class="food-actions"><button class="btn ${hit?'primary':''}" onclick="toggleFood(${i})">${hit?'✓ Consumida':'Marcar consumida'}</button><button class="btn" onclick="openRecipe(${S.nutritionDay},${i})">Ver receta</button></div></div></div>`;
}
function toggleFood(i){let k=S.food.findIndex(x=>x.date===logicalDay()&&x.day===S.nutritionDay&&x.meal===i);if(k>=0)S.food.splice(k,1);else S.food.push({date:logicalDay(),day:S.nutritionDay,meal:i,name:D.nutrition[S.nutritionDay].meals[i].name});save();renderNutrition();renderHome()}
function foodHistory(){let a=[...S.food].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);return a.length?a.map(x=>`<div class="row"><div class="row-main"><div class="row-title">${x.name}</div><div class="row-sub">${x.date} · Día ${x.day+1}</div></div></div>`).join(''):`<div class="muted small">Todavía no registraste comidas.</div>`}
function openRecipe(d,i){let m=D.nutrition[d].meals[i];openModal(`<h2>${m.name}</h2><div class="sub" style="margin:5px 0 16px">${m.label}</div><div class="card-title">Ingredientes</div><ul class="ingredients">${m.ingredients.map(x=>`<li>${x}</li>`).join('')}</ul><div class="card-title" style="margin-top:16px">Paso a paso</div><ol class="steps">${m.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="carb" style="margin-top:16px"><b>${m.carb.title}</b><div class="small">${m.carb.amount} · ${m.carb.household}</div><div class="small muted">${m.carb.replacements.join(' · ')}</div></div>`)}

function renderProgress(){
 let all=[];D.routines.forEach(r=>r.items.filter(e=>!e.custom).forEach(e=>{let h=exHistory(r.id,e.id);if(h.length)all.push({r,e,h})}));
 let last=S.body.at(-1)?.weight||83.7;
 $('#progress').innerHTML=`<div class="hdr"><div><h1>Progreso</h1><div class="sub">Cuerpo + cargas</div></div></div>
 <div class="grid2"><div class="metric"><small>Peso</small><b>${last.toFixed(1)} kg</b></div><div class="metric"><small>Meta</small><b>${S.target} kg</b></div></div>
 <div class="card" style="margin-top:12px"><div class="card-title">Registrar peso corporal</div><div class="field"><input id="bw" inputmode="decimal" placeholder="83.7"><button class="btn primary" onclick="addBW()">Guardar</button></div></div>
 <h4 style="margin:20px 4px 8px">Progresión de cargas</h4>
 <div class="list">${all.length?all.map(x=>loadRow(x)).join(''):`<div class="row"><div class="muted small">Empezá a registrar pesos en Entrenar para ver tu evolución.</div></div>`}</div>`;
}
function loadRow(x){let f=x.h[0].w,l=x.h.at(-1).w,d=l-f;return `<button class="row" onclick="openLoad('${x.r.id}','${x.e.id}')"><img class="thumb" src="${x.e.img}"><div class="row-main"><div class="row-title">${titleCase(x.e.name)}</div><div class="row-sub">${f} → ${l} kg · ${d>=0?'+':''}${d.toFixed(1)} kg</div></div><span class="chev">›</span></button>`}
function addBW(){let v=Number(String($('#bw').value).replace(',','.'));if(v){S.body.push({date:logicalDay(),weight:v});save();renderProgress();renderHome()}}
function openLoad(rid,eid){let r=D.routines.find(x=>x.id===rid),e=r.items.find(x=>x.id===eid),h=exHistory(rid,eid),max=Math.max(...h.map(x=>x.w));openModal(`<h2>${titleCase(e.name)}</h2><div class="sub">${r.day} · ${e.group}</div><div class="grid2" style="margin:16px 0"><div class="metric"><small>Primer registro</small><b>${h[0].w} kg</b></div><div class="metric"><small>Récord</small><b>${max} kg</b></div></div><table><thead><tr><th>Fecha</th><th>Peso</th><th>Cambio</th></tr></thead><tbody>${h.map((x,i)=>`<tr><td>${x.date}</td><td>${x.w} kg</td><td>${i?((x.w-h[i-1].w)>=0?'+':'')+(x.w-h[i-1].w).toFixed(1):'—'}</td></tr>`).reverse().join('')}</tbody></table>`)}

function renderMore(){
 $('#more').innerHTML=`<div class="hdr"><div><h1>Más</h1><div class="sub">Datos y respaldo</div></div></div>
 <div class="list"><button class="row" onclick="exportData()"><div class="row-main"><div class="row-title">Exportar respaldo</div><div class="row-sub">Descargar todos tus registros en JSON</div></div><span>›</span></button>
 <label class="row"><div class="row-main"><div class="row-title">Importar respaldo</div><div class="row-sub">Restaurar datos guardados</div></div><input type="file" accept=".json" onchange="importData(this.files[0])" style="display:none"><span>›</span></label>
 <button class="row" onclick="clearData()"><div class="row-main"><div class="row-title" style="color:var(--red)">Borrar datos</div><div class="row-sub">No se puede deshacer</div></div></button></div>
 <div class="card" style="margin-top:12px"><div class="card-title">GitHub Pages Ready</div><div class="notice">Esta versión no necesita npm, Vite, React ni Netlify. Solo archivos estáticos.</div></div>
 <div class="card"><div class="card-title">Créditos</div><div class="notice">Interfaz y catálogo de ejercicios adaptados a partir de openGym / exercise dataset. Ver NOTICE.md y LICENSE.</div></div>`;
}
function render(v=S.view){({home:renderHome,workout:renderWorkout,nutrition:renderNutrition,progress:renderProgress,more:renderMore}[v]||renderHome)()}
function openModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}$('#closeModal').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mi-transformacion-respaldo.json';a.click()}
function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{S=Object.assign(defaultState,JSON.parse(r.result));save();render();alert('Respaldo restaurado')}catch{alert('Archivo no válido')}};r.readAsText(f)}
function clearData(){if(confirm('¿Borrar todos los datos?')){localStorage.removeItem(LS);location.reload()}}
render();show(S.view,true);
// Service worker disabled in single-file GitHub Pages build.
setInterval(()=>{if(document.visibilityState==='visible'&&S.view==='nutrition')renderNutrition()},60000);

</script>
</body></html>
